<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brainbite</title>
  <meta name="description" content="Wissen in 5, 10, 15 oder 20 Minuten. Zum Lesen oder Zuhören.">
  <meta name="theme-color" content="#071417" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F6F6" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brainbite">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/img/brainbite-app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="preload" href="./assets/fonts/source-serif-4-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <script>
    // Erscheinungsbild vor dem ersten Zeichnen setzen (kein Aufblitzen)
    try {
      var s = JSON.parse(localStorage.getItem('brainbite:v1') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      if (s.lang === 'en') document.documentElement.lang = 'en';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main id="app" class="app" tabindex="-1"></main>
  <nav id="tabbar" class="c-tabbar" hidden></nav>
  <div id="overlay-root"></div>
  <noscript><p class="noscript">Brainbite braucht JavaScript. · Brainbite needs JavaScript.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
